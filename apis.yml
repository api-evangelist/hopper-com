- aid: hopper-com:hopper-com-sessions-api
  name: Hopper Sessions API
  description: "Hopper uses a unique ID to correlate API calls and events produced by a user's interaction\
    \ with an airline application.\nThe duration of the user's interactions is called a \"session\", and\
    \ the correlation ID is called a `session_id`.\n\nA session begins immediately before the airline’s\
    \ first API call to Hopper, and the airline must call the Create a Session endpoint at this time.\
    \ \nA `session_id` is returned from this call; it must be included with each subsequent API call via\
    \ the `HC-Session-ID` header. \nNo airline action is required to end the session."
  humanURL: https://github.com/hopper/hc-airlines-java
